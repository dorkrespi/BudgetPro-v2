<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BudgetPro</title>

    <!-- PWA: installable app -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6750A4">
    <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BudgetPro">

    <!-- Dark mode: apply the saved/system theme before first paint, so
         there's no flash of the wrong theme. Kept tiny and synchronous. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('budget_theme_preference');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
                // saved === 'system' (or nothing saved) - no attribute, CSS
                // media query below decides.
            } catch (e) {}
        })();
    </script>

    <!-- Color tokens (Material 3 palette). Defined as CSS variables so both
         light and dark values exist for every semantic color name used
         throughout the app (bg-primary, bg-surface, text-on-surface, ...).
         RGB-channel format (not hex) so Tailwind's opacity modifiers
         (bg-primary/10 etc.) keep working. -->
    <style>
        :root {
            --color-primary: 103 80 164;
            --color-on-primary: 255 255 255;
            --color-primary-container: 234 221 255;
            --color-on-primary-container: 33 0 93;
            --color-secondary: 98 91 113;
            --color-on-secondary: 255 255 255;
            --color-secondary-container: 232 222 248;
            --color-on-secondary-container: 29 25 43;
            --color-tertiary: 125 82 96;
            --color-on-tertiary: 255 255 255;
            --color-tertiary-container: 255 216 228;
            --color-on-tertiary-container: 49 17 29;
            --color-error: 179 38 30;
            --color-on-error: 255 255 255;
            --color-error-container: 249 222 220;
            --color-on-error-container: 65 14 11;
            --color-background: 255 251 254;
            --color-on-background: 28 27 31;
            --color-surface: 255 251 254;
            --color-on-surface: 28 27 31;
            --color-surface-variant: 231 224 236;
            --color-on-surface-variant: 73 69 79;
            --color-outline: 121 116 126;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --color-primary: 208 188 255;
                --color-on-primary: 56 30 114;
                --color-primary-container: 79 55 139;
                --color-on-primary-container: 234 221 255;
                --color-secondary: 204 194 220;
                --color-on-secondary: 51 45 65;
                --color-secondary-container: 74 68 88;
                --color-on-secondary-container: 232 222 248;
                --color-tertiary: 239 184 200;
                --color-on-tertiary: 73 37 50;
                --color-tertiary-container: 99 59 72;
                --color-on-tertiary-container: 255 216 228;
                --color-error: 242 184 181;
                --color-on-error: 96 20 16;
                --color-error-container: 140 29 24;
                --color-on-error-container: 249 222 220;
                --color-background: 28 27 31;
                --color-on-background: 230 225 229;
                --color-surface: 28 27 31;
                --color-on-surface: 230 225 229;
                --color-surface-variant: 73 69 79;
                --color-on-surface-variant: 202 196 208;
                --color-outline: 147 143 153;
            }
        }

        :root[data-theme="dark"] {
            --color-primary: 208 188 255;
            --color-on-primary: 56 30 114;
            --color-primary-container: 79 55 139;
            --color-on-primary-container: 234 221 255;
            --color-secondary: 204 194 220;
            --color-on-secondary: 51 45 65;
            --color-secondary-container: 74 68 88;
            --color-on-secondary-container: 232 222 248;
            --color-tertiary: 239 184 200;
            --color-on-tertiary: 73 37 50;
            --color-tertiary-container: 99 59 72;
            --color-on-tertiary-container: 255 216 228;
            --color-error: 242 184 181;
            --color-on-error: 96 20 16;
            --color-error-container: 140 29 24;
            --color-on-error-container: 249 222 220;
            --color-background: 28 27 31;
            --color-on-background: 230 225 229;
            --color-surface: 28 27 31;
            --color-on-surface: 230 225 229;
            --color-surface-variant: 73 69 79;
            --color-on-surface-variant: 202 196 208;
            --color-outline: 147 143 153;
        }
    </style>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'rgb(var(--color-primary) / <alpha-value>)',
                        'on-primary': 'rgb(var(--color-on-primary) / <alpha-value>)',
                        'primary-container': 'rgb(var(--color-primary-container) / <alpha-value>)',
                        'on-primary-container': 'rgb(var(--color-on-primary-container) / <alpha-value>)',
                        secondary: 'rgb(var(--color-secondary) / <alpha-value>)',
                        'on-secondary': 'rgb(var(--color-on-secondary) / <alpha-value>)',
                        'secondary-container': 'rgb(var(--color-secondary-container) / <alpha-value>)',
                        'on-secondary-container': 'rgb(var(--color-on-secondary-container) / <alpha-value>)',
                        tertiary: 'rgb(var(--color-tertiary) / <alpha-value>)',
                        'on-tertiary': 'rgb(var(--color-on-tertiary) / <alpha-value>)',
                        'tertiary-container': 'rgb(var(--color-tertiary-container) / <alpha-value>)',
                        'on-tertiary-container': 'rgb(var(--color-on-tertiary-container) / <alpha-value>)',
                        error: 'rgb(var(--color-error) / <alpha-value>)',
                        'on-error': 'rgb(var(--color-on-error) / <alpha-value>)',
                        'error-container': 'rgb(var(--color-error-container) / <alpha-value>)',
                        'on-error-container': 'rgb(var(--color-on-error-container) / <alpha-value>)',
                        background: 'rgb(var(--color-background) / <alpha-value>)',
                        'on-background': 'rgb(var(--color-on-background) / <alpha-value>)',
                        surface: 'rgb(var(--color-surface) / <alpha-value>)',
                        'on-surface': 'rgb(var(--color-on-surface) / <alpha-value>)',
                        'surface-variant': 'rgb(var(--color-surface-variant) / <alpha-value>)',
                        'on-surface-variant': 'rgb(var(--color-on-surface-variant) / <alpha-value>)',
                        outline: 'rgb(var(--color-outline) / <alpha-value>)',
                    }
                }
            }
        }
    </script>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Assistant', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Transitions */
        .page-transition {
            transition: opacity 0.2s ease-in-out;
        }

        /* Home Category Chart (MAX-like layout) */
        .home-cat-wrap {
            display: flex;
            flex-direction: row;
            direction: ltr;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            width: 100%;
            overflow: hidden;
        }
        .home-cat-list {
            display: block;
            column-count: 2;
            column-gap: 12px;
            flex: 1 1 auto;
            min-width: 0;
            text-align: right;
            direction: rtl;
        }
        .home-cat-item {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-end;
            width: 100%;
            min-height: 44px;
            margin: 0 0 10px;
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
        }
        .home-cat-amount-row {
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.05;
        }
        .home-cat-amount {
            font-size: 1.15rem;
            font-weight: 800;
            white-space: nowrap;
        }
        .home-cat-name {
            font-size: 0.86rem;
            color: #5f5b66;
            line-height: 1.15;
            margin-top: 2px;
            white-space: nowrap;
        }
        .home-cat-icon {
            font-size: 1rem;
            color: #6750A4;
        }
        .home-cat-donut-col {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 0 0 124px;
            width: 124px;
            min-width: 124px;
        }
        .home-cat-donut-box {
            width: 124px;
            height: 124px;
            position: relative;
            flex-shrink: 0;
        }
        .home-cat-donut-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
            line-height: 1.1;
            font-size: 0.95rem;
            color: #1C1B1F;
        }
        .home-cat-wrap canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        @media (min-width: 768px) {
            .home-cat-wrap {
                gap: 24px;
            }
            .home-cat-list {
                column-gap: 20px;
            }
            .home-cat-donut-col {
                flex: 0 0 220px;
                width: 220px;
                min-width: 220px;
            }
            .home-cat-donut-box {
                width: 220px;
                height: 220px;
            }
            .home-cat-amount {
                font-size: 1.6rem;
            }
            .home-cat-name {
                font-size: 1rem;
            }
            .home-cat-icon {
                font-size: 1.15rem;
            }
            .home-cat-donut-label {
                font-size: 1.9rem;
            }
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen">
    <div id="app">
        <!-- App content will be injected here -->
        <div id="loading-screen" class="fixed inset-0 flex items-center justify-center bg-background z-50">
            <div class="flex flex-col items-center gap-4">
                <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                <p class="text-primary font-medium">טוען...</p>
            </div>
        </div>
    </div>

    <!-- Toast Container: lives outside #app so it survives full re-renders -->
    <div id="toast-container" class="fixed inset-x-0 bottom-24 z-[200] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden">
        <div id="modal-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>
        <div id="modal-content" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[40px] p-8 shadow-2xl transform translate-y-full transition-transform duration-300 max-w-2xl mx-auto overflow-y-auto max-h-[90vh]">
            <!-- Modal content will be injected here -->
        </div>
    </div>

    <!-- App Logic -->
    <script src="app.js"></script>

    <!-- PWA: register service worker for offline shell + installability -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.warn('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
